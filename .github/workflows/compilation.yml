name: CI-compile

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build OPL ELF
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
    - name: Install dependencies
      run: |
        apk add build-base git zip gawk bash python3

    - name: git checkout
      uses: actions/checkout@v4

    - name: Setup Git safe directory
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch --prune --unshallow || true

    - name: Setup build tools and wrappers
      run: |
        mkdir -p /usr/local/ps2dev/ps2sdk/bin
        gcc -O2 pc/bin2s.c -o /usr/local/ps2dev/ps2sdk/bin/bin2s
        chmod +x /usr/local/ps2dev/ps2sdk/bin/bin2s
        cp /usr/local/ps2dev/ps2sdk/bin/bin2s /usr/local/bin/bin2s || true
        cp /usr/local/ps2dev/ps2sdk/bin/bin2s /usr/bin/bin2s || true
        for P in $(which -a iopfixup 2>/dev/null || which iopfixup); do
          if [ -f "$P" ] && [ ! -f "${P}.orig" ]; then
            echo "Wrapping $P with --allow-zero-text"
            mv "$P" "${P}.orig"
            printf '#!/bin/sh\nfor a in "$@"; do [ "$a" = "--allow-zero-text" ] && exec "%s.orig" "$@"; done\nexec "%s.orig" --allow-zero-text "$@"\n' "$P" "$P" > "$P"
            chmod +x "$P"
          fi
        done

    - name: Compile OPL ELF
      env:
        IOP_CFLAGS: "-std=gnu99 -Wno-incompatible-pointer-types -Wno-error -Wno-implicit-function-declaration"
      run: |
        make clean || true
        set -o pipefail
        make all 2>&1 | tee compile_output.log || (echo "=== COMPILE FAILURE LOG ==="; tail -n 80 compile_output.log; exit 1)
        ls -la *.elf *.ELF 2>/dev/null || true

    - name: Verify ee_core ELF layout
      run: |
        python3 -c "
        import struct, sys
        path = 'ee_core/ee_core.elf'
        with open(path, 'rb') as f:
            elf = f.read()
        e_entry, e_phoff, e_shoff = struct.unpack('<III', elf[24:36])
        e_phnum, = struct.unpack('<H', elf[44:46])
        print(f'Checking {path}: entry=0x{e_entry:08x}, phnum={e_phnum}')
        if e_entry != 0x00084000:
            print(f'ERROR: entry point is 0x{e_entry:08x}, expected 0x00084000!')
            sys.exit(1)
        found_load = False
        for i in range(e_phnum):
            ph = elf[e_phoff + i*32 : e_phoff + (i+1)*32]
            p_type, p_offset, p_vaddr, p_paddr, p_filesz, p_memsz, p_flags, p_align = struct.unpack('<IIIIIIII', ph)
            print(f'  PH {i}: type=0x{p_type:x}, vaddr=0x{p_vaddr:08x}, filesz=0x{p_filesz:x}, memsz=0x{p_memsz:x}, end=0x{p_vaddr+p_memsz:08x}')
            if p_type == 1:
                found_load = True
                if p_vaddr != 0x00084000:
                    print(f'ERROR: PT_LOAD vaddr is 0x{p_vaddr:08x}, expected 0x00084000!')
                    sys.exit(1)
                if p_vaddr + p_memsz > 0x00097000:
                    print(f'ERROR: PT_LOAD end (0x{p_vaddr+p_memsz:08x}) exceeds 0x00097000!')
                    sys.exit(1)
        if not found_load:
            print('ERROR: No PT_LOAD found!')
            sys.exit(1)
        print('SUCCESS: ee_core layout is valid!')
        " 2>&1 | tee -a compile_output.log

    - name: Upload compile log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: compile_log
        path: compile_output.log

    - name: Upload release artifact ELF
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: OPNPS2LD
        path: |
          OPNPS2LD.ELF
          OPNPS2LD-*.ELF
          opl.elf
          opl_stripped.elf
          *.ELF
          *.elf
